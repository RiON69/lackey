name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    name: tests (py${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv
      - run: uv pip install -e . pytest
      # Tests that drive the real mouse and keyboard skip themselves (tests/engine/conftest.py).
      - run: uv run --no-project pytest tests/engine -q
